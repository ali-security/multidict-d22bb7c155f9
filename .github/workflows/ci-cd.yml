---

name: CI/CD

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: >-
          Optional pytest selector (test path / node id); empty runs the
          full suite
        required: false
        type: string
        default: ''


env:
  COLOR: >-  # Supposedly, pytest or coveragepy use this
    yes
  FORCE_COLOR: 1  # Request colored output from CLI tools supporting it
  MYPY_FORCE_COLOR: 1  # MyPy's color enforcement
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PIP_NO_PYTHON_VERSION_WARNING: 1
  PIP_NO_WARN_SCRIPT_LOCATION: 1
  PRE_COMMIT_COLOR: always
  PROJECT_NAME: multidict
  PY_COLORS: 1  # Recognized by the `py` package, dependency of `pytest`
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1
  PYTHON_LATEST: 3.x


jobs:

  pre-setup:
    name: ⚙️ Pre-set global build settings
    runs-on: ubuntu-latest
    timeout-minutes: 1
    defaults:
      run:
        shell: python
    outputs:
      # NOTE: These aren't env vars because the `${{ env }}` context is
      # NOTE: inaccessible when passing inputs to reusable workflows.
      dists-artifact-name: python-package-distributions
      sdist-name: ${{ env.PROJECT_NAME }}-*.tar.gz
      wheel-name: ${{ env.PROJECT_NAME }}-*.whl
    steps:
    - run: >-
        print('No-op')


  build-pure-python-dists:
    name: 📦 Build distribution packages
    needs:
    - pre-setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sdist-filename: >-
        ${{ steps.dist-filenames-detection.outputs.sdist-filename }}
      wheel-filename: >-
        ${{ steps.dist-filenames-detection.outputs.wheel-filename }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Set up Python ${{ env.PYTHON_LATEST }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_LATEST }}
    - name: Install core libraries for build
      run: python -Im pip install build
    - name: Build sdists and pure-python wheel
      env:
        MULTIDICT_NO_EXTENSIONS: Y
        PIP_INDEX_URL: https://:2026-01-26T02:42:59.784906Z@time-machines-pypi.sealsecurity.io/
      run: python -Im build
    - name: Determine actual created filenames
      id: dist-filenames-detection
      run: >-
        {
        echo -n sdist-filename=
        ;
        basename "$(ls -1 dist/${{ needs.pre-setup.outputs.sdist-name }})"
        ;
        echo -n wheel-filename=
        ;
        basename "$(ls -1 dist/${{ needs.pre-setup.outputs.wheel-name }})"
        ;
        }
        >> "${GITHUB_OUTPUT}"
    - name: Upload built artifacts for testing
      uses: actions/upload-artifact@v6
      with:
        if-no-files-found: error
        name: ${{ needs.pre-setup.outputs.dists-artifact-name  }}
        # NOTE: Exact expected file names are specified here
        # NOTE: as a safety measure — if anything weird ends
        # NOTE: up being in this dir or not all dists will be
        # NOTE: produced, this will fail the workflow.
        path: |
          dist/${{ steps.dist-filenames-detection.outputs.sdist-filename }}
          dist/${{ steps.dist-filenames-detection.outputs.wheel-filename }}
        retention-days: 15

  build-wheels-for-tested-arches:
    name: >-
      Build ${{ matrix.tag }} wheels on ${{ matrix.runner-vm-os }}
    needs:
    - build-pure-python-dists
    - pre-setup  # transitive, for accessing settings
    strategy:
      matrix:
        runner-vm-os:
        - ubuntu-latest
        - ubuntu-24.04-arm
        - windows-latest
        - windows-11-arm
        - macos-latest
        tag:
        - ''
        - 'musllinux'
        exclude:
        - runner-vm-os: windows-latest
          tag: 'musllinux'
        - runner-vm-os: windows-11-arm
          tag: 'musllinux'
        - runner-vm-os: macos-latest
          tag: 'musllinux'
        - runner-vm-os: ubuntu-latest
          tag: none
    runs-on: ${{ matrix.runner-vm-os }}
    timeout-minutes: 45
    steps:
    - name: Export requested job-global environment variables
      env:
        INPUT_ENVIRONMENT_VARIABLES: |-
          CIBW_ARCHS_MACOS=x86_64 arm64 universal2

          CIBW_ARCHS_LINUX=${{ matrix.runner-vm-os == 'ubuntu-24.04-arm' && 'aarch64' || 'auto auto32' }}

          CIBW_ENVIRONMENT=PIP_INDEX_URL=https://:2026-01-26T02:42:59.784906Z@time-machines-pypi.sealsecurity.io/

          CIBW_SKIP<<EOF
          ${{ (matrix.tag == 'musllinux') && '*-manylinux_*' || '*-musllinux_*' }}
          pp*
          EOF
      run: echo "${INPUT_ENVIRONMENT_VARIABLES}" >> "${GITHUB_ENV}"
      shell: bash

    - name: Compute GHA artifact name ending
      id: gha-artifact-name
      run: |
        from hashlib import sha512
        from os import environ
        from pathlib import Path

        FILE_APPEND_MODE = 'a'

        inputs_json_str = """${{ toJSON(matrix) }}"""

        hash = sha512(inputs_json_str.encode()).hexdigest()

        with Path(environ['GITHUB_OUTPUT']).open(
                mode=FILE_APPEND_MODE,
        ) as outputs_file:
            print(f'hash={hash}', file=outputs_file)
      shell: python

    - name: Download the source distribution
      uses: actions/download-artifact@v7
      with:
        name: ${{ needs.pre-setup.outputs.dists-artifact-name }}
        path: dist/

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.3.1
      with:
        package-dir: >-  # not necessarily a dir, we pass an acceptable sdist
          dist/${{ needs.build-pure-python-dists.outputs.sdist-filename }}

    - name: Upload built artifacts for testing and publishing
      uses: actions/upload-artifact@v6
      with:
        if-no-files-found: error
        name: ${{ needs.pre-setup.outputs.dists-artifact-name }}-
          ${{ matrix.runner-vm-os }}-
          ${{ steps.gha-artifact-name.outputs.hash }}
        path: ./wheelhouse/*.whl

  test:
    name: >-
      Test ${{ matrix.os }}
      ${{ matrix.pyver }}
      ${{ matrix.no-extensions == 'Y' && ' ' || 'ext' }}
      ${{ matrix.debug == 'Y' && 'debug' || '' }}
    needs:
    - build-pure-python-dists  # transitive, for accessing settings
    - build-wheels-for-tested-arches
    - pre-setup  # transitive, for accessing settings
    strategy:
      matrix:
        pyver:
        - 3.14t
        - 3.14
        - 3.13t
        - 3.13
        - 3.12
        - 3.11
        - "3.10"
        - 3.9
        no-extensions: ['', 'Y']
        os: [ubuntu, macos, windows]
        debug: ['', 'Y']
        exclude:
        - no-extensions: Y
          debug: Y
        - os: macos
          no-extensions: Y
        - os: windows
          no-extensions: Y
        - os: macos
          pyver: 3.13t  # this is still tested within cibuildwheel
        - os: windows
          pyver: 3.13t  # this is still tested within cibuildwheel
        - no-extensions: Y
          debug: Y
        include:
        - pyver: pypy-3.9
          no-extensions: Y
          os: ubuntu
          debug: ''
      fail-fast: false
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 15

    continue-on-error: >-
      ${{
        endsWith(matrix.pyver, '-dev')
        && true
        || false
      }}

    steps:
    - name: Determine build type
      id: build_type
      run: |
        echo "build_type=${{
          (contains(matrix.pyver, '-dev') || matrix.debug == 'Y') &&
          'source' || 'wheel'
        }}" >> "$GITHUB_OUTPUT"
      shell: sh
    - name: Retrieve the project source from an sdist inside the GHA artifact
      uses: re-actors/checkout-python-sdist@release/v2
      with:
        source-tarball-name: >-
          ${{ needs.build-pure-python-dists.outputs.sdist-filename }}
        workflow-artifact-name: >-
          ${{ needs.pre-setup.outputs.dists-artifact-name }}
    - name: Download distributions
      if: steps.build_type.outputs.build_type == 'wheel'
      uses: actions/download-artifact@v7
      with:
        pattern: ${{ needs.pre-setup.outputs.dists-artifact-name }}*
        merge-multiple: true
        path: dist

    - name: Setup Python ${{ matrix.pyver }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.pyver }}
        allow-prereleases: true
    - name: Compute runtime Python version
      id: python-install
      run: |
        import sys
        from os import environ
        from pathlib import Path

        FILE_APPEND_MODE = 'a'

        python_version_str = ".".join(
            map(str, sys.version_info[:3]),
        )
        freethreading_suffix = (
            '' if sys.version_info < (3, 13) or sys._is_gil_enabled()
            else 't'
        )

        with Path(environ['GITHUB_OUTPUT']).open(
                mode=FILE_APPEND_MODE,
        ) as outputs_file:
            print(
                f'python-version={python_version_str}{freethreading_suffix}',
                file=outputs_file,
            )
      shell: python

    - name: Get pip cache dir
      id: pip-cache
      run: |
        echo "dir=$(pip cache dir)" >> "${GITHUB_OUTPUT}"
      shell: bash
    - name: Cache PyPI
      uses: actions/cache@v5
      with:
        key: >-
          pip-ci-${{
            runner.os
          }}-${{
            matrix.pyver
          }}-${{
            matrix.no-extensions
          }}-${{
            matrix.debug
          }}-${{
            hashFiles('requirements/*.txt')
          }}
        path: ${{ steps.pip-cache.outputs.dir }}
        restore-keys: >-
          pip-ci-${{
            runner.os
          }}-${{
            matrix.pyver
          }}-${{
            matrix.no-extensions
          }}-${{
            matrix.debug
          }}
    - name: Install dependencies
      uses: py-actions/py-dependency-install@v4
      with:
        path: requirements/pytest.txt
    - name: Determine pre-compiled compatible wheel
      if: steps.build_type.outputs.build_type == 'wheel'
      env:
        # NOTE: When `pip` is forced to colorize output piped into `jq`,
        # NOTE: the latter can't parse it. So we're overriding the color
        # NOTE: preference here via https://no-color.org.
        # NOTE: Setting `FORCE_COLOR` to any value (including 0, an empty
        # NOTE: string, or a "YAML null" `~`) doesn't have any effect and
        # NOTE: `pip` (through its verndored copy of `rich`) treats the
        # NOTE: presence of the variable as "force-color" regardless.
        #
        # NOTE: This doesn't actually work either, so we'll resort to unsetting
        # NOTE: in the Bash script.
        # NOTE: Ref: https://github.com/Textualize/rich/issues/2622
        NO_COLOR: 1
      id: wheel-file
      run: >
        echo -n path= | tee -a "${GITHUB_OUTPUT}"


        unset FORCE_COLOR


        python
        -X utf8
        -u -I
        -m pip install
        --find-links=./dist
        --no-index
        '${{ env.PROJECT_NAME }}'
        --force-reinstall
        --no-color
        --no-deps
        --only-binary=:all:
        --dry-run
        --report=-
        --quiet
        | jq --raw-output .install[].download_info.url
        | tee -a "${GITHUB_OUTPUT}"
      shell: bash
    - name: Ensure clean for source build
      if: steps.build_type.outputs.build_type == 'source'
      run: >-
        make clean
      shell: bash
    - name: Self-install (from ${{ steps.build_type.outputs.build_type }})
      env:
        MULTIDICT_NO_EXTENSIONS: ${{ matrix.no-extensions }}
        MULTIDICT_DEBUG_BUILD: 1  # Always on for source builds
      run: >-
        pip install '${{
          steps.build_type.outputs.build_type == 'source'
          && '.'
          || steps.wheel-file.outputs.path
        }}'
    - name: Run unittests
      env:
        # coverage>=7.16 defaults to core=sysmon on 3.14, which warns on
        # --cov-context=test and filterwarnings=error turns that into errors
        # (ctrace is unavailable on 3.13t / PyPy, so keep their default core)
        COVERAGE_CORE: >-
          ${{ startsWith(matrix.pyver, '3.14') && 'ctrace' || '' }}
      run: >-
        python -Im pytest ${{ inputs.test-filter || 'tests' }} -v
        --cov-report xml
        --junitxml=.test-results/pytest/test.xml
        --${{ matrix.no-extensions == 'Y' && 'no-' || '' }}c-extensions
    - name: Produce markdown test summary from JUnit
      if: >-
        !cancelled()
      uses: test-summary/action@v2.4
      with:
        paths: .test-results/pytest/test.xml
    - name: Append coverage results to Job Summary
      if: >-
        !cancelled()
      run: >-
        python -Im coverage report --format=markdown
        >> "${GITHUB_STEP_SUMMARY}"
      shell: bash
    - name: Re-run the failing tests with maximum verbosity
      if: >-
        !cancelled()
        && failure()
      run: >-  # `exit 1` makes sure that the job remains red with flaky runs
        python -Im
        pytest --no-cov -vvvvv --lf -rA
        --${{ matrix.no-extensions == 'Y' && 'no-' || '' }}c-extensions
        && exit 1
      shell: bash
    - name: Prepare coverage artifact
      # combining Linux and Windows paths is tricky, left this exercise for
      # others multidict has no Windows or macOS specific code paths anyway
      if: ${{ matrix.os == 'ubuntu' }}
      uses: aio-libs/prepare-coverage@v24.9.2


  test-summary:
    name: Tests status
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs:
    - build-pure-python-dists  # transitive, for accessing settings
    - pre-setup  # transitive, for accessing settings
    - test
    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}
    - name: Retrieve the project source from an sdist inside the GHA artifact
      uses: re-actors/checkout-python-sdist@release/v2
      with:
        source-tarball-name: >-
          ${{ needs.build-pure-python-dists.outputs.sdist-filename }}
        workflow-artifact-name: >-
          ${{ needs.pre-setup.outputs.dists-artifact-name }}
    - name: Download artifacts
      uses: actions/download-artifact@v7
      with:
        pattern: coverage*
        merge-multiple: true
        path: ${{ runner.temp }}/coverage
    - name: Install coverage
      run: |
        pip install coverage
      shell: bash
    - name: Combine coverage reports
      run: |
        coverage combine '${{ runner.temp }}/coverage'
      shell: bash
    - name: Generate XML coverage report
      run: |
        coverage xml
      shell: bash

  pre-deploy:
    name: Pre-Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: test-summary
    # Run only on pushing a tag
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
    - name: Dummy
      run: |
        echo "Predeploy step"

  build-wheels-for-odd-archs:
    name: >-
      Build ${{ matrix.tag }} wheels for ${{ matrix.qemu }}
      (${{ matrix.cibw-build }})
    needs:
    - build-pure-python-dists
    - pre-setup  # transitive, for accessing settings
    strategy:
      matrix:
        qemu:
        - ppc64le
        - s390x
        - armv7l
        tag:
        - ''
        - musllinux
        cibw-build:
        - cp39-* cp310-*
        - cp311-* cp312-*
        - cp313-* cp313t-*
        - cp314-* cp314t-*
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - name: Export requested job-global environment variables
      env:
        # CIBW_ARCHS_LINUX: Build emulated architectures if QEMU, else "auto"
        INPUT_ENVIRONMENT_VARIABLES: |-
          CIBW_ARCHS_LINUX=${{ matrix.qemu }}

          CIBW_ARCHS_MACOS=x86_64 arm64 universal2

          CIBW_BUILD=${{ matrix.cibw-build }}

          CIBW_ENVIRONMENT=PIP_INDEX_URL=https://:2026-01-26T02:42:59.784906Z@time-machines-pypi.sealsecurity.io/

          CIBW_SKIP=${{
            (matrix.tag == 'musllinux')
            && '*-manylinux_*'
            || '*-musllinux_*'
          }} pp*
      run: echo "${INPUT_ENVIRONMENT_VARIABLES}" >> "${GITHUB_ENV}"
      shell: bash

    - name: Compute GHA artifact name ending
      id: gha-artifact-name
      run: |
        from hashlib import sha512
        from os import environ
        from pathlib import Path

        FILE_APPEND_MODE = 'a'

        inputs_json_str = """${{ toJSON(matrix) }}"""

        hash = sha512(inputs_json_str.encode()).hexdigest()

        with Path(environ['GITHUB_OUTPUT']).open(
                mode=FILE_APPEND_MODE,
        ) as outputs_file:
            print(f'hash={hash}', file=outputs_file)
      shell: python

    - name: Download the source distribution
      uses: actions/download-artifact@v7
      with:
        name: ${{ needs.pre-setup.outputs.dists-artifact-name }}
        path: dist/

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.3.1
      with:
        package-dir: >-  # not necessarily a dir, we pass an acceptable sdist
          dist/${{ needs.build-pure-python-dists.outputs.sdist-filename }}

    - name: Upload built artifacts for testing and publishing
      uses: actions/upload-artifact@v6
      with:
        if-no-files-found: error
        name: ${{ needs.pre-setup.outputs.dists-artifact-name }}-
          ubuntu-latest-
          qemu-
          ${{ steps.gha-artifact-name.outputs.hash }}
        path: ./wheelhouse/*.whl

  deploy:
    name: Deploy
    needs:
    - build-pure-python-dists
    - build-wheels-for-odd-archs
    - build-wheels-for-tested-arches
    - pre-deploy
    - pre-setup  # transitive, for accessing settings
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for trusted publishing & sigstore

    environment:
      name: pypi
      url: https://pypi.org/p/${{ env.PROJECT_NAME }}

    steps:
    - name: Retrieve the project source from an sdist inside the GHA artifact
      uses: re-actors/checkout-python-sdist@release/v2
      with:
        source-tarball-name: >-
          ${{ needs.build-pure-python-dists.outputs.sdist-filename }}
        workflow-artifact-name: >-
          ${{ needs.pre-setup.outputs.dists-artifact-name }}

    - name: Download distributions
      uses: actions/download-artifact@v7
      with:
        pattern: ${{ needs.pre-setup.outputs.dists-artifact-name }}*
        merge-multiple: true
        path: dist
    - run: |
        tree
    - name: Login
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
    - name: Make Release
      uses: aio-libs/create-release@v1.6.6
      with:
        changes_file: CHANGES.rst
        name: ${{ env.PROJECT_NAME }}
        version_file: ${{ env.PROJECT_NAME }}/__init__.py
        github_token: ${{ secrets.GITHUB_TOKEN }}
        artifact: >-
          ${{ needs.pre-setup.outputs.dists-artifact-name }}
        head_line: >-
          {version}\n=+\n\n\*\({date}\)\*\n
        fix_issue_regex: >-
          :issue:`(\d+)`
        fix_issue_repl: >-
          #\1

    - name: >-
        Publish 🐍📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.2.0
      with:
        inputs: >-
          ./dist/${{ needs.build-pure-python-dists.outputs.sdist-filename }}
          ./dist/*.whl

    - name: Upload artifact signatures to GitHub Release
      # Confusingly, this action also supports updating releases, not
      # just creating them. This is what we want here, since we've manually
      # created the release above.
      uses: softprops/action-gh-release@v2
      with:
        # dist/ contains the built packages, which smoketest-artifacts/
        # contains the signatures and certificates.
        files: dist/**

...
